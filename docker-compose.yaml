version: '3.8'

services:
  db:
    image: 'postgres:15-alpine'
    container_name: lielo-postgres
    restart: always
    environment:
      POSTGRES_USER: lielo_admin
      POSTGRES_PASSWORD: 'LieloDatabasePassword226'
      POSTGRES_DB: lielo_db
    volumes:
      - 'lielo-db-data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U lielo_admin -d lielo_db'
      interval: 5s
      timeout: 5s
      retries: 5

  open-webui:
    build: .                          # <-- Indique à Coolify de builder ton code personnalisé !
    container_name: lielo-app
    restart: always
    expose:
      - '8080'
    volumes:
      - 'open-webui-data:/app/backend/data'
    environment:
      - 'WEBUI_NAME=Lielo'
      - 'DATABASE_URL=postgresql://lielo_admin:LieloDatabasePassword226@db:5432/lielo_db'
      - 'WEBUI_SECRET_KEY=t7b_R9_wK2mXzP5vQuC8jN1eF4yA3sD6gH9_Lielo226_xZ7kM2pW5vQ9zX4r'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://127.0.0.1:8080'
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  open-webui-data:
  lielo-db-data:
